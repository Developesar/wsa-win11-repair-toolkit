name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate PowerShell and repository text
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $null = [scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
            Write-Host "OK $($_.Name)"
          }

      - name: Check for non-ASCII tracked content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = git ls-files
          $bad = @()
          foreach ($file in $files) {
            if ($file -like '.github/ISSUE_TEMPLATE/*') {
              continue
            }
            $content = Get-Content -LiteralPath $file -Raw -ErrorAction SilentlyContinue
            if ($null -ne $content -and $content -match '[^\x00-\x7F]') {
              $bad += $file
            }
          }
          if ($bad.Count -gt 0) {
            throw "Non-ASCII content found in: $($bad -join ', ')"
          }
